buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

// Library version changes only when its implementation or resources change.
ext.modVersion = '0.1.26'
ext.modName = 'GTNRLib'
ext.modId = 'gtnrlib'
ext.modGroup = 'com.xyp.gtnrlib'
ext.generateGradleTokenClass = ''
ext.accessTransformersFile = 'gtnrlib_at.cfg'
ext.coreModClass = 'asm.EarlyMixinsLoader'
ext.customArchiveBaseName = 'gtnrlib'
ext.usesShadowedDependencies = true
ext['gtnh.modules.ideIntegration'] = false

apply plugin: 'com.gtnewhorizons.gtnhconvention'
apply from: rootProject.file('repositories.gradle')

def elytraModpackVersion = rootProject.extensions.getByName('elytraModpackVersion')

// Compile the optional tool adapters into the library without putting their mods on its runtime classpath.
sourceSets.main.java.srcDir 'src/optional/java'
configurations.create('animationCompat') { canBeConsumed = false }
configurations.compileOnly.extendsFrom(configurations.animationCompat)

dependencies {
    animationCompat(elytraModpackVersion.gtnhdev('GT5-Unofficial') as String) { transitive = false }
    animationCompat(elytraModpackVersion.gtnhdev('TinkersConstruct') as String) { transitive = false }
    animationCompat('net.industrial-craft:industrialcraft-2:2.2.828-experimental:dev') { transitive = false }
    shadowImplementation('org.luaj:luaj-jse:3.0.1') { transitive = false }
    api(elytraModpackVersion.gtnhdev('GTNHLib') as String) { transitive = false }
    api(elytraModpackVersion.gtnhdev('ModularUI2') as String) { transitive = false }
    runtimeOnly(elytraModpackVersion.gtnhdev('Baubles-Expanded') as String) { transitive = false }
    implementation('com.github.GTNewHorizons:GTNHExtLib:1.0.5') { transitive = false }
    implementation('it.unimi.dsi:fastutil:8.5.18')
    implementation('org.joml:joml:1.10.8') { transitive = false }
    compileOnly(elytraModpackVersion.gtnhdev('Angelica') as String) { transitive = false }
    compileOnly('org.jetbrains:annotations:26.0.1')
    compileOnly("${elytraModpackVersion.gtnh('lwjgl3ify')}:api") { transitive = false }
    implementation('org.ow2.asm:asm-commons:9.8')
    compileOnly(elytraModpackVersion.gtnhdev('ModularUI') as String) { transitive = false }
    compileOnly(elytraModpackVersion.gtnhdev('NotEnoughItems') as String) { transitive = false }
    compileOnly(elytraModpackVersion.gtnhdev('CodeChickenCore') as String) { transitive = false }
    compileOnly('curse.maven:neverenoughanimation-1062347:7664003-sources-7663978') { transitive = false }
    compileOnly('org.projectlombok:lombok:1.18.42')
    annotationProcessor('org.projectlombok:lombok:1.18.42')
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
tasks.register('checkLibraryContracts', JavaExec) {
    group = 'verification'
    dependsOn tasks.testClasses
    classpath = sourceSets.test.runtimeClasspath + (sourceSets.main.compileClasspath - configurations.animationCompat)
    mainClass = 'com.xyp.gtnrlib.LibraryContracts'
    if (project.hasProperty('hmiRelease')) systemProperty 'gtnrlib.test.hmi', project.property('hmiRelease')
    workingDir = projectDir
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
tasks.named('check') { dependsOn 'checkLibraryContracts' }
tasks.named('test', Test) { failOnNoDiscoveredTests = false }

configurations.create('distribution') {
    canBeConsumed = true
    canBeResolved = false
    attributes.attribute(Attribute.of('com.xyp.gtnrlib.artifacts', String), 'distribution')
}

['reobfJar', 'downgradeJar', 'sourcesJar'].each { archive ->
    artifacts.add('distribution', tasks.named(archive))
}

tasks.named('shadowJar') {
    exclude 'lua.class', 'luac.class', 'luajc*.class', 'META-INF/services/javax.script.ScriptEngineFactory'
}

['jar', 'shadowJar', 'sourcesJar'].each { archive ->
    tasks.named(archive, Jar) {
        from(rootProject.file('licenses/gtnrlib')) { into 'META-INF/licenses/gtnrlib' }
    }
}

['Client', 'Server'].each { side ->
    ['', '17', '21', '25'].each { version ->
        tasks.named("run${side}${version}", JavaExec) {
            workingDir = file("run/${side.toLowerCase()}${version ? '_new' : ''}")
            doFirst { workingDir.mkdirs() }
        }
    }
}
