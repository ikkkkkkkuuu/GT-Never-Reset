gradle.projectsEvaluated {
    def lib = gradle.rootProject.project(':gtnrlib')
    def host = gradle.startParameter.projectProperties.containsKey('animationQaHost') ? gradle.rootProject : lib
    def mode = host == lib ? 'server' : 'host-server'
    def out = lib.file("build/animation-qa/" + mode)
    def classes = new File(out, 'classes')
    def fixture = lib.tasks.register('compileAnimationServerQA', JavaCompile) {
        dependsOn lib.tasks.named('classes')
        source lib.file('scripts/qa/AnimationServerChecks.java')
        classpath = lib.sourceSets.test.compileClasspath
        destinationDirectory.set(classes)
        javaCompiler.set(lib.javaToolchains.compilerFor(lib.java.toolchain))
        options.compilerArgs += ['-proc:none']
    }
    host.tasks.named('runServer25', JavaExec).configure {
        dependsOn fixture
        // The host includes Angelica for client development. Its OpenGL coremod cannot run on a dedicated server.
        if (host != lib) classpath = classpath.filter { !it.name.toLowerCase(Locale.ROOT).startsWith('angelica-') }
        classpath += lib.files(classes)
        workingDir lib.file("run/animation-qa/" + mode)
        systemProperty 'gtnrlib.animation.server.result', new File(out,'result.txt').absolutePath
        args 'nogui'
        doFirst {
            workingDir.mkdirs()
            new File(workingDir,'server.properties').setText('server-ip=127.0.0.1\nserver-port=0\nlevel-type=FLAT\nview-distance=3\n','UTF-8')
            java.nio.file.Files.deleteIfExists(new File(out,'result.txt').toPath())
        }
        doLast {
            if (!new File(out,'result.txt').isFile()) throw new GradleException('dedicated-server fixture did not reach startup')
        }
    }
}
