// Run with: gradlew.bat -I src/qa/resources/projector-dedicated-server-qa.init.gradle :runServer25 --no-configuration-cache
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def constructionActions = root.providers.gradleProperty('projectorConstructionActionChecks').isPresent()
    def fixtureClass = constructionActions ? 'ProjectorConstructionActionChecks' : 'ProjectorDeploymentServerChecks'
    def output = root.layout.buildDirectory
        .dir(constructionActions ? 'projector-construction-action-qa' : 'projector-dedicated-server-qa').get().asFile
    def fixture = root.tasks.register('compileProjectorDedicatedServerQA', JavaCompile) {
        dependsOn root.tasks.named('classes')
        source root.file("src/qa/java/com/xyp/gtneverreset/qa/${fixtureClass}.java")
        classpath = root.sourceSets.test.compileClasspath
        destinationDirectory.set(new File(output, 'classes'))
        javaCompiler.set(root.javaToolchains.compilerFor(root.java.toolchain))
        options.compilerArgs += ['-proc:none']
    }
    root.tasks.named('runServer25', JavaExec).configure {
        dependsOn fixture
        classpath = classpath.filter { !it.name.toLowerCase(Locale.ROOT).startsWith('angelica-') }
        classpath += root.files(new File(output, 'classes'))
        systemProperty 'gtnr.projector.server.result', new File(output, 'result.txt').absolutePath
        args 'nogui'
        timeout = java.time.Duration.ofMinutes(5)
        notCompatibleWithConfigurationCache('isolated dedicated-server regression')
        doFirst {
            output.mkdirs()
            workingDir = java.nio.file.Files.createTempDirectory(output.toPath(), 'run-').toFile()
            java.nio.file.Files.deleteIfExists(new File(output, 'result.txt').toPath())
            new File(workingDir, 'eula.txt').setText('eula=true\n', 'UTF-8')
            new File(workingDir, 'server.properties').setText(
                'server-ip=127.0.0.1\nserver-port=0\nlevel-type=FLAT\nview-distance=2\nspawn-protection=0\n', 'UTF-8')
            def config = new File(workingDir, 'config/GTNeverReset/item.cfg')
            config.parentFile.mkdirs()
            config.setText('tools {\n    B:enableMultiblockProjector=true\n}\n', 'UTF-8')
        }
        doLast {
            def result = new File(output, 'result.txt')
            if (!result.isFile() || result.text.trim() != 'PASS') {
                throw new GradleException("Projector dedicated-server regression failed; see ${output}")
            }
        }
    }
}
