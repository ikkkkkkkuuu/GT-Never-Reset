// Run with: gradlew.bat -I src/qa/resources/projector-creative-qa.init.gradle :runClient17 --no-configuration-cache
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.project(':gtnrlib').tasks.named('runClient17').configure { enabled = false }
    def fixture = root.hasProperty('projectorFormationChecks') ? 'ProjectorFormationChecks' : root.hasProperty('projectorBatchHatchChecks') ? 'ProjectorBatchHatchChecks' : root.hasProperty('projectorSurvivalChecks') ? 'ProjectorSurvivalChecks' : root.hasProperty('projectorMirrorChecks') ? 'ProjectorMirrorChecks' : 'ProjectorCreativeChecks'
    def pinnedGrid = root.hasProperty('projectorPinnedGridChecks')
    if (pinnedGrid) fixture = 'ProjectorPinnedGridChecks'
    def tallSingularity = root.hasProperty('projectorSingularityTallChecks')
    def coldShaders = root.hasProperty('projectorColdShaders')
    if (root.hasProperty('projectorDeploymentChecks') || tallSingularity || coldShaders) fixture = 'ProjectorDeploymentChecks'
    def materialCrafting = root.hasProperty('projectorMaterialCraftingChecks')
    if (materialCrafting) fixture = 'ProjectorSurvivalChecks'
    root.spotless.java { target root.file("src/qa/java/com/xyp/gtneverreset/qa/${fixture}.java") }
    def crossDimension = Boolean.getBoolean('gtnr.projector.crossDimensionQa')
    def baseline = crossDimension && Boolean.getBoolean('gtnr.projector.crossDimensionBaseline')
    def directoryName = tallSingularity ? 'projector-singularity-tall-qa' : materialCrafting ? 'projector-material-crafting-qa' : crossDimension ? (baseline ? 'projector-cross-dimension-baseline' : 'projector-cross-dimension-qa') : 'projector-creative-qa'
    if (coldShaders) directoryName = 'projector-cold-shader-qa'
    if (pinnedGrid) directoryName = 'projector-pinned-grid-qa'
    def marker = pinnedGrid ? 'gtnr.projector.pinnedGrid.qa' : 'gtnr.projector.creative.qa'
    def qaDirectory = root.layout.buildDirectory.dir(directoryName)

    root.tasks.named('compileTestJava').configure {
        options.incremental = false
        options.release.set(17)
        destinationDirectory.set(qaDirectory.map { it.dir('test-classes') })
        setSource(root.files("src/qa/java/com/xyp/gtneverreset/qa/${fixture}.java"))
    }
    def snapshot = root.tasks.register('snapshotCreativeProjectorQA', Sync) {
        dependsOn root.tasks.named('testClasses')
        from qaDirectory.map { it.dir('test-classes') }
        include "**/${fixture}*.class"
        into qaDirectory.map { it.dir('classes') }
    }
    root.tasks.named('runClient17').configure {
        javaLauncher.set(root.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) })
        classpath += root.configurations.testRuntimeClasspath.filter { it.name.startsWith('jvmdowngrader-java-api-') }
        dependsOn snapshot
        classpath += root.files(qaDirectory.map { it.dir('classes') })
        workingDir root.file("build/${directoryName}/run")
        systemProperty marker, 'true'
        systemProperty 'gtnr.projector.materialCraftingQa', materialCrafting
        systemProperty 'gtnr.projector.singularityTallQa', tallSingularity
        systemProperty 'gtnr.projector.crossDimensionQa', crossDimension
        systemProperty 'gtnr.projector.crossDimensionBaseline', baseline
        systemProperty 'java.security.manager', 'allow'
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        args '--width', pinnedGrid ? '1280' : '1100', '--height', pinnedGrid ? '800' : '740'
        notCompatibleWithConfigurationCache('isolated live-client verification')
        doFirst {
            def output = root.file("build/${directoryName}")
            output.mkdirs()
            workingDir.mkdirs()
            root.copy { from root.file('run/client/falsepattern'); include '*.jar'; into new File(workingDir,'falsepattern') }
            def cfg = new File(workingDir, 'config/GTNeverReset/item.cfg')
            cfg.parentFile.mkdirs()
            cfg.text = 'tools {\n    B:enableMultiblockProjector=true\n}\n'
            new File(workingDir, 'config').mkdirs()
            new File(workingDir, 'config/splash.properties').text = 'enabled=false\n'
            new File(workingDir, 'config/DreamCoreMod.properties').text = 'showConfirmExitWindow=false\n'
            java.nio.file.Files.deleteIfExists(new File(workingDir, 'result.txt').toPath())
            if (pinnedGrid) {
                ['projector-pinned-hud.png', 'projector-pinned-editor.png', 'projector-full-batch.png', 'projector-dismantle-confirmation.png'].each { name ->
                    java.nio.file.Files.deleteIfExists(new File(workingDir, 'screenshots/' + name).toPath())
                }
            }
            if (crossDimension) {
                java.nio.file.Files.deleteIfExists(new File(workingDir, 'projector-cross-dimension-report.txt').toPath())
            }
            def options = 'lang:zh_CN\nguiScale:2\npauseOnLostFocus:false\nsoundCategory_master:0.0\nsoundCategory_music:0.0\nmusic:0.0\nsound:0.0\n'
            if (coldShaders) {
                def uniform = 'qaCold_' + UUID.randomUUID().toString().replace('-', '')
                def pack = new File(workingDir, 'resourcepacks/projector-cold-shaders')
                def shaderPath = 'assets/gtnrlib/shaders/fx'
                def shaders = new File(pack, shaderPath)
                shaders.mkdirs()
                new File(pack, 'pack.mcmeta').setText('{"pack":{"pack_format":1,"description":"Cold shader QA"}}', 'UTF-8')
                ['plasma_star.frag.glsl', 'backdrop_refraction.frag.glsl'].each { name ->
                    def source = root.file("gtnrlib/src/main/resources/${shaderPath}/${name}").getText('UTF-8')
                    def shader = source.replace('#version 120', "#version 120\nuniform float ${uniform};")
                    def color = shader.lastIndexOf('gl_FragColor = ')
                    def end = color >= 0 ? shader.indexOf(';', color) : -1
                    if (shader == source || end < 0) throw new GradleException("Cannot create cold shader QA variant for ${name}")
                    // Linked GLSL uniforms default to zero. Distinct active uniforms keep the image and change the compiled program.
                    new File(shaders, name).setText(
                        shader.substring(0, end) + " + vec4(${uniform}, 0.0, 0.0, 0.0)" + shader.substring(end), 'UTF-8')
                }
                options += 'resourcePacks:["projector-cold-shaders"]\n'
                systemProperty 'gtnr.projector.coldShaderUniform', uniform
                logger.lifecycle("[projector-singularity-qa] cold shader pack with active uniform ${uniform}")
            }
            new File(workingDir, 'options.txt').setText(options, 'UTF-8')
            if (System.getProperty('os.name').startsWith('Windows')) {
                def ready = new File(output, 'window-helper.ready')
                java.nio.file.Files.deleteIfExists(ready.toPath())
                def helper = new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', root.file('gtnrlib/scripts/qa/HideTestClient.ps1').absolutePath,
                    '-Workspace', root.projectDir.absolutePath, '-Marker', "-D${marker}=true".toString(),
                    '-ReadyFile', "build/${directoryName}/window-helper.ready".toString())
                    .redirectErrorStream(true).redirectOutput(new File(output, 'window-helper.log')).start()
                for (int i = 0; i < 100 && !ready.exists() && helper.isAlive(); i++) Thread.sleep(100)
                if (!ready.exists()) throw new GradleException('Background window guard did not start')
            }
        }
        doLast {
            if (new File(workingDir, 'result.txt').text.trim() != 'PASS') throw new GradleException('Projector generation checks failed')
        }
    }
}
