// Exercises the wireless HUD with Angelica, or with -PwirelessMonitorQaVanilla.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def qa = root.file('build/wireless-monitor/' + (root.hasProperty('wirelessMonitorQaVanilla') ? 'vanilla' : 'angelica'))
    def vanilla = root.hasProperty('wirelessMonitorQaVanilla')
    def classes = new File(qa, 'client-classes')
    root.extensions.findByName('spotless')?.java {
        target 'scripts/qa/WirelessMonitorClientChecks.java'
    }
    root.tasks.named('compileTestJava').configure {
        options.release.set(17)
        destinationDirectory.set(classes)
        setSource(root.files('scripts/qa/WirelessMonitorClientChecks.java'))
    }
    root.sourceSets.test.output.classesDirs.setFrom(root.files(classes).builtBy(root.tasks.named('compileTestJava')))
    root.tasks.named('runClient17').configure {
        javaLauncher.set(root.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) })
        dependsOn root.tasks.named('testClasses')
        classpath += root.files(classes)
        classpath += root.configurations.testRuntimeClasspath.filter { it.name.startsWith('jvmdowngrader-java-api-') }
        if (vanilla) classpath = classpath.filter { !it.name.toLowerCase(Locale.ROOT).startsWith('angelica-') }
        workingDir new File(qa, 'client-run')
        systemProperty 'gtnr.wirelessMonitor.qa', 'true'
        systemProperty 'gtnr.wirelessMonitor.client.qa', 'true'
        systemProperty 'gtnr.wirelessMonitor.qa.output', qa.absolutePath
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        args '--width', '1280', '--height', '960'
        notCompatibleWithConfigurationCache('isolated wireless HUD verification')
        doFirst {
            classpath = root.files(classpath.files.findAll { it.exists() })
            workingDir.mkdirs()
            java.nio.file.Files.deleteIfExists(new File(qa, 'client-result.txt').toPath())
            root.copy {
                from root.file('run/client/falsepattern')
                include '*.jar'
                into new File(workingDir, 'falsepattern')
            }
            new File(workingDir, 'options.txt').setText(
                'lang:zh_CN\nguiScale:2\npauseOnLostFocus:false\nsoundCategory_master:0.0\nmusic:0.0\nsound:0.0\n', 'UTF-8')
            def dreamCore = new File(workingDir, 'config/DreamCoreMod.properties')
            dreamCore.parentFile.mkdirs()
            dreamCore.setText('showConfirmExitWindow=false\n', 'UTF-8')
            new File(workingDir, 'config/splash.properties').setText('enabled=false\n', 'UTF-8')
            def helper = new File(qa, 'HideWirelessMonitorClient.ps1')
            helper.setText(root.file('scripts/qa/HideWildcardClient.ps1').getText('UTF-8')
                .replace('gtnr.wildcard.qa', 'gtnr.wirelessMonitor.client.qa'), 'UTF-8')
            new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                '-ExecutionPolicy', 'Bypass', '-File', helper.absolutePath, '-Workspace', root.projectDir.absolutePath)
                .redirectErrorStream(true).redirectOutput(new File(qa, 'window-helper.log')).start()
        }
        doLast {
            def result = new File(qa, 'client-result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') throw new GradleException('Wireless monitor QA failed')
        }
    }
}
