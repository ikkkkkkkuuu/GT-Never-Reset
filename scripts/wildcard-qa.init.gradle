// Verifies the actual wildcard editor, NEI import and registered material previews in an isolated client.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def scenario = root.findProperty('wildcardQaScenario') ?: 'import'
    if (!(scenario in ['import', 'preview'])) throw new GradleException('Expected wildcardQaScenario=import or preview')
    def checkName = scenario == 'import' ? 'WildcardImportClientChecks' : 'WildcardPreviewClientChecks'
    def qaBase = root.findProperty('wildcardQaRoot') ? root.file(root.property('wildcardQaRoot')) : root.layout.buildDirectory.get().asFile
    def qaDirectory = root.layout.dir(root.provider { new File(qaBase, "wildcard-${scenario}-qa") })
    root.extensions.findByName('spotless')?.java {
        target 'scripts/qa/Wildcard*Checks.java'
    }
    root.tasks.named('compileTestJava').configure {
        options.release.set(17)
        destinationDirectory.set(qaDirectory.map { it.dir('test-classes') })
        setSource(root.files("scripts/qa/${checkName}.java", 'scripts/qa/WildcardIntegrationChecks.java',
            'scripts/qa/WildcardCoreChecks.java'))
    }
    root.tasks.named('runClient17').configure {
        javaLauncher.set(root.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) })
        classpath += root.configurations.testRuntimeClasspath.filter { it.name.startsWith('jvmdowngrader-java-api-') }
        dependsOn root.tasks.named('testClasses')
        classpath += root.files(qaDirectory.map { it.dir('test-classes') })
        workingDir qaDirectory.get().dir('run').asFile
        systemProperty "gtnr.wildcard${scenario.capitalize()}.qa", 'true'
        systemProperty "gtnr.wildcard${scenario.capitalize()}.qa.output", qaDirectory.get().asFile.absolutePath
        systemProperty 'gtnr.wildcard.qa', 'true'
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        args '--width', '1100', '--height', '800'
        notCompatibleWithConfigurationCache('isolated wildcard client verification')
        doFirst {
            qaDirectory.get().asFile.mkdirs()
            workingDir.mkdirs()
            java.nio.file.Files.deleteIfExists(new File(qaDirectory.get().asFile, 'result.txt').toPath())
            new File(workingDir, 'options.txt').setText(
                'lang:zh_CN\nguiScale:2\npauseOnLostFocus:false\nsoundCategory_master:0.0\nsoundCategory_music:0.0\nmusic:0.0\nsound:0.0\n',
                'UTF-8')
            def dreamCore = new File(workingDir, 'config/DreamCoreMod.properties')
            dreamCore.parentFile.mkdirs()
            dreamCore.setText('showConfirmExitWindow=false\n', 'UTF-8')
            root.copy {
                from root.file('run/client/falsepattern')
                include '*.jar'
                into new File(workingDir, 'falsepattern')
            }
            if (System.getProperty('os.name').startsWith('Windows')) {
                new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', root.file('scripts/qa/HideWildcardClient.ps1').absolutePath,
                    '-Workspace', root.projectDir.absolutePath)
                    .redirectErrorStream(true)
                    .redirectOutput(new File(qaDirectory.get().asFile, 'window-helper.log'))
                    .start()
            }
        }
        doLast {
            def result = new File(qaDirectory.get().asFile, 'result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') {
                throw new GradleException("Wildcard ${scenario} QA failed; inspect the isolated client log")
            }
        }
    }
}
