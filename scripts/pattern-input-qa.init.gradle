// Runs the two pattern assemblies in an isolated client, without adding QA code to the distributed mod.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def qaDirectory = root.layout.buildDirectory.dir('pattern-input-qa')
    root.extensions.findByName('spotless')?.java {
        target 'scripts/qa/PatternInputClientChecks.java'
    }
    root.tasks.named('compileTestJava').configure {
        options.release.set(8)
        destinationDirectory.set(qaDirectory.map { it.dir('test-classes') })
        setSource(root.files('scripts/qa/PatternInputClientChecks.java'))
    }
    def snapshot = root.tasks.register('snapshotPatternInputQA', Sync) {
        dependsOn root.tasks.named('testClasses')
        from qaDirectory.map { it.dir('test-classes') }
        include '**/PatternInputClientChecks*.class'
        into qaDirectory.map { it.dir('classes') }
    }
    root.tasks.named('runClient').configure {
        dependsOn snapshot
        classpath += root.files(qaDirectory.map { it.dir('classes') })
        workingDir root.file('build/pattern-input-qa/run')
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        notCompatibleWithConfigurationCache('isolated live-client verification')
        doFirst {
            workingDir.mkdirs()
            java.nio.file.Files.deleteIfExists(new File(workingDir, 'result.txt').toPath())
            new File(workingDir, 'options.txt').setText(
                'lang:en_US\npauseOnLostFocus:false\nguiScale:2\nsoundCategory_master:0.0\nmusic:0.0\nsound:0.0\n',
                'UTF-8')
        }
        doLast {
            def result = new File(workingDir, 'result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') {
                throw new GradleException('Pattern assembly QA failed; inspect PATTERN_INPUT_QA in the client log.')
            }
        }
    }
}
