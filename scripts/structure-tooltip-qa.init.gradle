// Verifies automatic structure tooltips against real StructureLib elements and GT mixins.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def qa = root.file('build/structure-tooltip-port/qa')
    def client = root.hasProperty('structure-tooltipQaClient')
    def classes = new File(qa, client ? 'client-classes' : 'server-classes')
    root.extensions.findByName('spotless')?.java {
        target 'scripts/qa/StructureTooltip*Checks.java'
    }
    root.tasks.named('compileTestJava').configure {
        options.release.set(17)
        destinationDirectory.set(classes)
        setSource(root.files(client
            ? ['scripts/qa/StructureTooltipChecks.java', 'scripts/qa/StructureTooltipClientChecks.java']
            : ['scripts/qa/StructureTooltipChecks.java']))
    }
    root.sourceSets.test.output.classesDirs.setFrom(root.files(classes).builtBy(root.tasks.named('compileTestJava')))
    root.tasks.named(client ? 'runClient17' : 'runServer17').configure {
        javaLauncher.set(root.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) })
        dependsOn root.tasks.named('testClasses')
        classpath += root.files(classes)
        classpath += root.configurations.testRuntimeClasspath.filter { it.name.startsWith('jvmdowngrader-java-api-') }
        if (!client) classpath = classpath.filter { !it.name.toLowerCase(Locale.ROOT).startsWith('angelica-') }
        workingDir new File(qa, client ? 'client-run' : 'server-run')
        systemProperty 'gtnr.structureTooltip.qa', 'true'
        systemProperty 'gtnr.structureTooltip.client.qa', client.toString()
        systemProperty 'gtnr.structureTooltip.qa.output', qa.absolutePath
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        if (client) args '--width', '1280', '--height', '960'
        else args 'nogui'
        notCompatibleWithConfigurationCache('isolated structure tooltip verification')
        doFirst {
            classpath = root.files(classpath.files.findAll { it.exists() })
            workingDir.mkdirs()
            java.nio.file.Files.deleteIfExists(new File(qa, client ? 'client-result.txt' : 'server-result.txt').toPath())
            root.copy {
                from root.file('run/client/falsepattern')
                include '*.jar'
                into new File(workingDir, 'falsepattern')
            }
            if (client) {
                new File(workingDir, 'options.txt').setText(
                    'lang:en_US\nguiScale:2\npauseOnLostFocus:false\nsoundCategory_master:0.0\nmusic:0.0\nsound:0.0\n', 'UTF-8')
                def dreamCore = new File(workingDir, 'config/DreamCoreMod.properties')
                dreamCore.parentFile.mkdirs()
                dreamCore.setText('showConfirmExitWindow=false\n', 'UTF-8')
                new File(workingDir, 'config/splash.properties').setText('enabled=false\n', 'UTF-8')
                def helper = new File(qa, 'HideStructureTooltipClient.ps1')
                helper.setText(root.file('scripts/qa/HideWildcardClient.ps1').getText('UTF-8')
                    .replace('gtnr.wildcard.qa', 'gtnr.structureTooltip.client.qa'), 'UTF-8')
                new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', helper.absolutePath, '-Workspace', root.projectDir.absolutePath)
                    .redirectErrorStream(true).redirectOutput(new File(qa, 'window-helper.log')).start()
            } else {
                new File(workingDir, 'eula.txt').setText('eula=true\n', 'UTF-8')
                new File(workingDir, 'server.properties').setText(
                    'online-mode=false\nserver-port=0\nlevel-name=structure-tooltip-qa\nlevel-type=FLAT\n' +
                        'generate-structures=false\nspawn-protection=0\nview-distance=2\ndifficulty=0\nmax-tick-time=-1\n',
                    'UTF-8')
            }
        }
        doLast {
            def result = new File(qa, client ? 'client-result.txt' : 'server-result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') throw new GradleException('Structure tooltip QA failed')
        }
    }
}
