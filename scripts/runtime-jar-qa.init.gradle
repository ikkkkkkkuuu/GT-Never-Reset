// Opt-in client regression for IO item rendering and holding the wireless frequency card.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def qa = root.file('build/runtime-jar-qa')
    root.extensions.findByName('spotless')?.java {
        target 'scripts/qa/RuntimeJarClientChecks.java'
    }
    root.tasks.named('compileTestJava').configure {
        options.release.set(17)
        destinationDirectory.set(new File(qa, 'classes'))
        setSource(root.files('scripts/qa/RuntimeJarClientChecks.java'))
    }
    root.tasks.named('runClient17').configure {
        javaLauncher.set(root.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) })
        dependsOn root.tasks.named('testClasses')
        classpath += root.files(new File(qa, 'classes'))
        classpath += root.configurations.testRuntimeClasspath.filter { it.name.startsWith('jvmdowngrader-java-api-') }
        workingDir new File(qa, 'run')
        systemProperty 'gtnr.runtimeJar.qa', 'true'
        systemProperty 'gtnr.runtimeJar.output', qa.absolutePath
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        args '--width', '1100', '--height', '740'
        doFirst {
            qa.mkdirs()
            workingDir.mkdirs()
            java.nio.file.Files.deleteIfExists(new File(qa, 'result.txt').toPath())
            new File(workingDir, 'options.txt').setText(
                'lang:zh_CN\nguiScale:2\npauseOnLostFocus:false\nsoundCategory_master:0.0\nsoundCategory_music:0.0\n', 'UTF-8')
            def config = new File(workingDir, 'config')
            config.mkdirs()
            new File(config, 'DreamCoreMod.properties').setText('showConfirmExitWindow=false\n', 'UTF-8')
            new File(config, 'splash.properties').setText('enabled=false\n', 'UTF-8')
            root.copy {
                from root.file('run/client/falsepattern')
                include '*.jar'
                into new File(workingDir, 'falsepattern')
            }
            if (System.getProperty('os.name').startsWith('Windows')) {
                def helper = new File(qa, 'HideRuntimeClient.ps1')
                helper.setText(root.file('scripts/qa/HideWildcardClient.ps1').getText('UTF-8')
                    .replace('gtnr.wildcard.qa', 'gtnr.runtimeJar.qa'), 'UTF-8')
                new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', helper.absolutePath,
                    '-Workspace', root.projectDir.absolutePath)
                    .redirectErrorStream(true).redirectOutput(new File(qa, 'window-helper.log')).start()
            }
        }
        doLast {
            def result = new File(qa, 'result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') {
                throw new GradleException('Runtime JAR client QA failed; inspect the isolated client log')
            }
        }
    }
}
