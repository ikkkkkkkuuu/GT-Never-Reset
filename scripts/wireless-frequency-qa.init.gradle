// Runs the frequency card in an isolated client without packaging the QA mod.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def qaDirectory = root.layout.buildDirectory.dir('wireless-frequency-qa')
    root.extensions.findByName('spotless')?.java {
        target 'scripts/qa/WirelessFrequencyClientChecks.java'
    }
    root.tasks.named('compileTestJava').configure {
        options.release.set(17)
        destinationDirectory.set(qaDirectory.map { it.dir('test-classes') })
        setSource(root.files('scripts/qa/WirelessFrequencyClientChecks.java'))
    }
    def snapshot = root.tasks.register('snapshotWirelessFrequencyQA', Sync) {
        dependsOn root.tasks.named('testClasses')
        from qaDirectory.map { it.dir('test-classes') }
        include '**/WirelessFrequencyClientChecks*.class'
        into qaDirectory.map { it.dir('classes') }
    }
    root.tasks.named('runClient17').configure {
        javaLauncher.set(root.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) })
        classpath += root.configurations.testRuntimeClasspath.filter { it.name.startsWith('jvmdowngrader-java-api-') }
        dependsOn snapshot
        classpath += root.files(qaDirectory.map { it.dir('classes') })
        workingDir root.file('build/wireless-frequency-qa/run')
        systemProperty 'gtnr.wirelessFrequency.qa', 'true'
        systemProperty 'gtnr.wirelessFrequency.multiSource', root.findProperty('wirelessFrequencyMultiSource') ?: 'false'
        systemProperty 'gtnr.wirelessFrequency.performance', root.findProperty('wirelessFrequencyPerformance') ?: 'false'
        systemProperty 'gtnr.wirelessFrequency.output', root.file('build/wireless-frequency-qa').absolutePath
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        args '--width', '1100', '--height', '740'
        notCompatibleWithConfigurationCache('isolated live-client verification')
        doFirst {
            def output = root.file('build/wireless-frequency-qa')
            output.mkdirs()
            workingDir.mkdirs()
            java.nio.file.Files.deleteIfExists(new File(output, 'result.txt').toPath())
            new File(workingDir, 'options.txt').setText(
                'lang:zh_CN\nguiScale:2\npauseOnLostFocus:false\nsoundCategory_master:0.0\nsoundCategory_music:0.0\nmusic:0.0\nsound:0.0\n',
                'UTF-8')
            if (System.getProperty('os.name').startsWith('Windows')) {
                def helper = new File(output, 'HideFrequencyClient.ps1')
                helper.setText('''param([Parameter(Mandatory = $true)][string]$Workspace)
Add-Type @'
using System;
using System.Runtime.InteropServices;
public static class FrequencyQaWindows {
    public delegate bool Visitor(IntPtr window, IntPtr data);
    [DllImport("user32.dll")] public static extern bool EnumWindows(Visitor visitor, IntPtr data);
    [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr window, out uint process);
    [DllImport("user32.dll")] public static extern int GetWindowLong(IntPtr window, int index);
    [DllImport("user32.dll")] public static extern int SetWindowLong(IntPtr window, int index, int value);
    [DllImport("user32.dll")] public static extern bool SetLayeredWindowAttributes(IntPtr window, uint color, byte alpha, uint flags);
    [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr window, int command);
}
'@
$deadline = [DateTime]::UtcNow.AddMinutes(10)
$seenClient = $false
$changed = [Collections.Generic.HashSet[long]]::new()
while ([DateTime]::UtcNow -lt $deadline) {
    $clients = @(Get-CimInstance Win32_Process -Filter "Name = 'java.exe' OR Name = 'javaw.exe'" |
        Where-Object { $_.CommandLine -and $_.CommandLine.Contains('-Dgtnr.wirelessFrequency.qa=true') -and $_.CommandLine.Contains($Workspace) })
    if ($clients.Count -eq 0 -and $seenClient) { break }
    if ($clients.Count -gt 0) { $seenClient = $true }
    $clientIds = @($clients | ForEach-Object { [uint32]$_.ProcessId })
    [FrequencyQaWindows]::EnumWindows({
        param($window, $data)
        [uint32]$ownerId = 0
        [void][FrequencyQaWindows]::GetWindowThreadProcessId($window, [ref]$ownerId)
        if ($clientIds -contains $ownerId -and $changed.Add($window.ToInt64())) {
            [void][FrequencyQaWindows]::ShowWindow($window, 0)
            $style = [FrequencyQaWindows]::GetWindowLong($window, -20)
            $style = ($style -band (-bnot 0x40000)) -bor 0x800A0
            [void][FrequencyQaWindows]::SetWindowLong($window, -20, $style)
            [void][FrequencyQaWindows]::SetLayeredWindowAttributes($window, 0, 0, 2)
            [void][FrequencyQaWindows]::ShowWindow($window, 4)
            [Console]::WriteLine("Hidden QA window for process " + $ownerId)
        }
        return $true
    }, [IntPtr]::Zero) | Out-Null
    Start-Sleep -Milliseconds 250
}
''', 'UTF-8')
                new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', helper.absolutePath,
                    '-Workspace', root.projectDir.absolutePath)
                    .redirectErrorStream(true)
                    .redirectOutput(new File(output, 'window-helper.log'))
                    .start()
            }
        }
        doLast {
            def result = root.file('build/wireless-frequency-qa/result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') {
                throw new GradleException('Wireless frequency client check failed; inspect WIRELESS_FREQUENCY_QA in the client log.')
            }
        }
    }
}
