// A running LaunchClassLoader keeps ZIP offsets. Rebuilding its JAR in place corrupts lazy class loads.
// Give each game process its own copies, outside build/ so even clean cannot remove live inputs.
afterEvaluate {
    tasks.withType(JavaExec).matching { it.name.startsWith('runClient') || it.name.startsWith('runServer') }.each { runTask ->
        def buildRoot = layout.buildDirectory
        def runtimeRoot = layout.projectDirectory.dir('.gradle/game-runtime/' + runTask.name)
        def launchSnapshot = null
        def cleanup = tasks.register(runTask.name + 'CleanupSnapshot') {
            description = 'Remove only the JAR snapshot owned by this completed game launch'
            notCompatibleWithConfigurationCache('cleanup uses the snapshot allocated by this game launch')
            doLast {
                if (launchSnapshot == null) return
                def expectedParent = runtimeRoot.asFile.toPath().toAbsolutePath().normalize()
                if (launchSnapshot.parent != expectedParent || !launchSnapshot.fileName.toString().startsWith('launch-')) {
                    throw new GradleException('Refusing to delete a game snapshot outside its launch directory')
                }
                project.delete(launchSnapshot.toFile())
                logger.lifecycle('[game runtime] removed launch JAR snapshot: {}', launchSnapshot)
            }
        }
        // Finalizers also run when JavaExec fails (for example, a client exits with a crash code).
        runTask.finalizedBy(cleanup)
        runTask.notCompatibleWithConfigurationCache('game launches snapshot their generated JARs immediately before execution')
        runTask.doFirst {
            def generatedRoot = buildRoot.get().asFile.toPath().toAbsolutePath().normalize()
            def snapshotRoot = runtimeRoot.asFile.toPath().toAbsolutePath().normalize()
            java.nio.file.Files.createDirectories(snapshotRoot)
            def snapshot = java.nio.file.Files.createTempDirectory(snapshotRoot, 'launch-')
            launchSnapshot = snapshot
            def launchClasspath = classpath.files.collect { entry ->
                def source = entry.toPath().toAbsolutePath().normalize()
                if (!entry.isFile() || !entry.name.endsWith('.jar') || !source.startsWith(generatedRoot)) return entry
                def target = snapshot.resolve(generatedRoot.relativize(source))
                java.nio.file.Files.createDirectories(target.parent)
                java.nio.file.Files.copy(source, target)
                target.toFile()
            }
            classpath = project.files(launchClasspath)
            logger.lifecycle('[game runtime] launch JAR snapshot: {}', snapshot)
        }
    }
}

// Keep Windows NIO socket files outside redirected user temporary directories.
// Apply this to compiler workers and the Minecraft launch configurations generated for the IDE.
if (providers.systemProperty('os.name').get().startsWith('Windows')) {
    def socketDirectory = providers.systemProperty('jdk.net.unixdomain.tmpdir')
        .orElse(providers.environmentVariable('SystemRoot').map { it + '/Temp' })
    def socketJvmArgument = socketDirectory.map { '-Djdk.net.unixdomain.tmpdir=' + it }
    minecraft.extraRunJvmArguments.add(socketJvmArgument)
    tasks.withType(JavaCompile).configureEach {
        options.forkOptions.jvmArgs.add(socketJvmArgument.get())
    }
}

def translationFormats = project.ext.translationFormatValidator
// Developer QA sources are optional local files and are not required by a fresh checkout.
if (file('scripts/qa/WirelessCardCompatibilityChecks.java').isFile()) {
    def wirelessCompatibilityClasses = layout.buildDirectory.dir('wireless-card-compatibility/classes')
    def wirelessCompatibilityCompiler = tasks.named('compileJava', JavaCompile).flatMap { it.javaCompiler }
    def wirelessCompatibilityLauncher = javaToolchains.launcherFor(java.toolchain)

    def compileWirelessCompatibility = tasks.register('compileWirelessCardCompatibility', JavaCompile) {
        dependsOn tasks.named('compileJava')
        source file('scripts/qa/WirelessCardCompatibilityChecks.java')
        classpath = sourceSets.main.compileClasspath + sourceSets.main.output
        destinationDirectory.set(wirelessCompatibilityClasses)
        javaCompiler.set(wirelessCompatibilityCompiler)
        options.release.set(17)
    }

    tasks.register('verifyWirelessCardCompatibility', JavaExec) {
        group = 'verification'
        description = 'Verify wireless card identity, saved sources and copied link recovery'
        dependsOn compileWirelessCompatibility
        javaLauncher.set(wirelessCompatibilityLauncher)
        classpath = files(wirelessCompatibilityClasses) + sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
        mainClass.set('com.xyp.gtneverreset.utils.machine.wireless.WirelessCardCompatibilityChecks')
    }

    def wirelessCompatibilityFormatSources = files(
        fileTree('src/main/java') { include '**/*.java' },
        fileTree('src/test/java') { include '**/*.java' },
        file('scripts/qa/WirelessCardCompatibilityChecks.java'))
    spotless.java {
        target wirelessCompatibilityFormatSources
    }
}

def colorCodes = [
    "BLACK": "\u00a70", "DARK_BLUE": "\u00a71", "DARK_GREEN": "\u00a72", "DARK_AQUA": "\u00a73",
    "DARK_RED": "\u00a74", "DARK_PURPLE": "\u00a75", "GOLD": "\u00a76", "GRAY": "\u00a77",
    "DARK_GRAY": "\u00a78", "BLUE": "\u00a79", "GREEN": "\u00a7a", "AQUA": "\u00a7b",
    "RED": "\u00a7c", "LIGHT_PURPLE": "\u00a7d", "YELLOW": "\u00a7e", "WHITE": "\u00a7f",
    "OBFUSCATED": "\u00a7k", "BOLD": "\u00a7l", "STRIKETHROUGH": "\u00a7m",
    "UNDERLINE": "\u00a7n", "ITALIC": "\u00a7o", "RESET": "\u00a7r", "SPACE": " ", "NULL": ""
]

afterEvaluate {
    def preprocessLang = tasks.register('preprocessLangInJavaFiles') {
        group = 'language'
        description = 'Extract translation strings from Java comments and generate lang files'

        def langDir = file("src/main/resources/assets/${project.findProperty('modId')}/lang")
        inputs.files(sourceSets.main.java)
        inputs.file('addon.gradle')
        outputs.dir(langDir)

        doLast {
            def replaceColors = { String text ->
                text.replaceAll(/\{\\\\([A-Z_]+)\}/) { match, code ->
                    colorCodes.containsKey(code) ? colorCodes[code] : match
                }
            }
            Map<String, Map<String, String>> langs = ['en_US': [:]]
            Set<String> keyOrder = [] as LinkedHashSet

            inputs.files.filter { it.name.endsWith('.java') }.sort { it.path }.each { sourceFile ->
                String pendingKey = null
                sourceFile.getText('UTF-8').eachLine { line ->
                    if (pendingKey != null) {
                        def m = line =~ /\/\/\s*#\s*([a-z]{2}_[A-Z]{2})?\s+(.+)/
                        if (m) {
                            def lang = m.group(1) ?: 'en_US'
                            def value = replaceColors(m.group(2))

                            if (!langs.containsKey(lang)) {
                                langs[lang] = [:]
                            }
                            if (langs[lang].containsKey(pendingKey) && langs[lang][pendingKey] != value) {
                                logger.lifecycle("[lang override] '${pendingKey}' in ${sourceFile.name}: ${langs[lang][pendingKey]} -> ${value}")
                            }
                            langs[lang][pendingKey] = value
                            keyOrder.add(pendingKey)
                        } else {
                            pendingKey = null
                        }
                    }

                    if (pendingKey == null) {
                        def m = line =~ /\/\/\s*#tr\s+([a-zA-Z0-9._]+)\s*(.*)/
                        if (m) {
                            def key = m.group(1)
                            def value = m.group(2)?.trim()
                            if (value) {
                                langs['en_US'][key] = replaceColors(value)
                                keyOrder.add(key)
                            } else {
                                pendingKey = key
                            }
                        }
                    }
                }
            }

            def enKeys = langs['en_US'].keySet()
            langs.each { langCode, translations ->
                if (langCode != 'en_US') {
                    enKeys.each { key ->
                        if (!translations.containsKey(key)) {
                            logger.warn("[missing lang] '${key}' is missing in ${langCode} (en_US=${langs['en_US'][key]})")
                        }
                    }
                }
            }

            def formatErrors = translationFormats.validate(langs)
            if (!formatErrors.empty) {
                throw new GradleException('Invalid translation formats:\n' + formatErrors.join('\n'))
            }

            langDir.mkdirs()
            langs.each { langCode, translations ->
                def outFile = new File(langDir, "${langCode}.lang")
                outFile.withWriter('UTF-8') { writer ->
                    keyOrder.each { key ->
                        def value = translations.containsKey(key) ? translations[key] : langs['en_US'][key]
                        if (value != null) {
                            writer.write("${key}=${value}\n")
                        }
                    }
                }
            }

            logger.lifecycle("Generated lang files in: ${langDir}")
        }
    }

    tasks.named('processResources').configure {
        dependsOn preprocessLang
    }
    tasks.named('sourcesJar').configure {
        dependsOn preprocessLang
    }
}

